[package]
name = "emerald"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
asciidork-parser = "0.36"
asciidork-ast = "0.36"
asciidork-core = "0.36"
gpui = { version = "=0.3.4", package = "gpui-pre" }
gpui-base = "=0.6.1"
gpui-component = "=0.6.1"
gpui-component-macros = "=0.6.1"
gpui-kit = { version = "=0.6.1", default-features = false, features = ["component", "tree-sitter-markdown", "tree-sitter-markdown-inline"] }
gpui-kit-assets = "=0.6.1"
gpui_platform = { version = "=0.3.4", package = "gpui-pre-platform", default-features = false, features = ["wayland", "x11"] }
tree-sitter = "=0.26.13"
notify = "8"
sys-locale = "0.3"
futures = "0.3"
trash = "5"
unicode-segmentation = "1"
unicode-width = "0.2"
minisign-verify = "=0.2.5"
sha2 = "0.10"


tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
gpui = { version = "=0.3.4", package = "gpui-pre", features = ["test-support"] }
tempfile = "3.10"

[[bin]]
name = "emerald"
path = "src/main.rs"
test = true
